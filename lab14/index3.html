<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Головна сторінка - Завдання 3</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 40px; text-align: center; }
        .content-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        .main-btn { background-color: #6f42c1; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        .main-btn:hover { background-color: #59339d; }
    </style>
</head>
<body>

    <div class="content-box">
        <h1>Моя естетична сторінка</h1>
        <p>Це головна сторінка. Щоб отримати доступ, вам потрібно зареєструватися.</p>
        <button class="main-btn" onclick="openFormWindow()">Відкрити вікно форми</button>
    </div>

    <script>
        function openFormWindow() {
            let formWindow = window.open("", "RegistrationForm", "width=450,height=550");

            let htmlCode = `
                <!DOCTYPE html>
                <html lang="uk">
                <head>
                    <meta charset="UTF-8">
                    <title>Реєстрація</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
                        input { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; display: block; margin: 0 auto 15px auto; }
                        button { width: 95%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 0 auto; display: block; }
                        button:hover { background-color: #218838; }
                    </style>
                </head>
                <body>
                    <h2>Форма реєстрації</h2>
                    <input type="text" id="name" placeholder="Ваше ім'я">
                    <input type="email" id="email" placeholder="Ваш Email">
                    <input type="password" id="password" placeholder="Пароль (мінімум 6 символів)">
                    <button onclick="validateForm()">Зареєструватися</button>

                    <script>
                        function validateForm() {
                            let name = document.getElementById('name').value;
                            let email = document.getElementById('email').value;
                            let password = document.getElementById('password').value;

                            console.log("Початок перевірки користувача: " + name);

                            if (name === "" || email === "" || password === "") {
                                console.error("Помилка: Користувач не заповнив всі поля.");
                                alert("Помилка! Будь ласка, заповніть усі поля.");
                                return;
                            }

                            if (password.length < 6) {
                                console.warn("Помилка: Пароль містить лише " + password.length + " символів.");
                                alert("Помилка! Пароль має містити не менше 6 символів.");
                                return;
                            }

                            console.log("Успіх: Користувач " + name + " зареєстрований.");
                            alert(name + ", вітаємо! Ви успішно зареєстровані!");
                        }
                    </scr` + `ipt>
                </body>
                </html>
            `;

            formWindow.document.write(htmlCode);
            formWindow.document.close();
        }
    </script>

</body>
</html>
