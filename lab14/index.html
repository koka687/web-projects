<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Робота з вікнами (Лабораторна 14)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; 
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .frame-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Лабораторна робота 14: Вікна та Фрейми</h1>

    <button onclick="showMessage()">Натисни тут</button>

    <button onclick="openNewWindow()">Відкрити Google</button>

    <button onclick="confirmMessage()">Перевірка (OK/Cancel)</button>

    <button onclick="promptMessage()">Введіть ім'я</button>

    <div class="frame-container">
        <h3>Сайт у фреймі:</h3>
        <iframe src="https://itcollege.lviv.ua/" width="500" height="300" style="border: 2px solid #ccc;">
            Ваш браузер не підтримує плаваючі фрейми!
        </iframe>
    </div>


    <script>

        function showMessage() {
            alert("Це спливаюче вікно.");
        }

        function openNewWindow() {
            window.open("https://www.google.com", "_blank", "width=400,height=300");
        }

        function confirmMessage() {
            let result = confirm("Ви впевнені?");
            if (result) {
                alert("Ви натиснули OK.");
            } else {
                alert("Ви натиснули Cancel.");
            }
        }

        function promptMessage() {
            let name = prompt("Як вас звати?", "Напишіть своє ім'я"); 

            if (name !== null && name !== "") {
                alert("Вітаю, " + name + "!");
            } else {
                alert("Ви нічого не ввели.");
            }
        }
    </script>

</body>
</html>
