<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Обробка форм та подій</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .task-box { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h3 { color: #333; margin-top: 0; }
        input { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
        button { padding: 8px 15px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>Завдання 2: Робота з формами</h1>

    <div class="task-box">
        <h3>1. Проста форма привітання</h3>
        <form>
            <input type="text" id="userName" placeholder="Ваше ім'я">
            <button type="button" onclick="greetUser()">Привітати</button>
        </form>
    </div>

    <div class="task-box">
        <h3>2. Відстеження тексту </h3>
        <input type="text" id="inputField" oninput="showInput()" placeholder="Почни вводити текст...">
    </div>

    <div class="task-box">
        <h3>3. Відміна відправки форми </h3>
        <form onsubmit="handleSubmit(event)">
            <input type="text" id="dataInput" placeholder="Введіть будь-які дані">
            <button type="submit">Надіслати</button>
        </form>
    </div>

    <script>

        function greetUser() {
            let name = document.getElementById("userName").value;
            alert("Вітаю, " + name + "!");
        }

        function showInput() {
            let text = document.getElementById("inputField").value;
            console.log("Ви ввели: " + text);
        }

        function handleSubmit(event) {

            event.preventDefault(); 
            let value = document.getElementById("dataInput").value;
            alert("Успішно перехоплено! Введено: " + value);
        }
    </script>

</body>
</html>
