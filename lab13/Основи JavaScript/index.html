<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Знайомство з JS - Галерея</title>
    <style>

        body {
            background-color: #e6e6fa; 
            font-family: Arial, sans-serif;
            text-align: center; 
            padding: 20px;
        }

        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 15px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Моя естетична галерея</h1>

    <div>
        <img id="main-photo" src="photo1.png" alt="Головне фото" />
    </div>

    <button onclick="changePhoto()">Змінити фото</button>
    <button onclick="addMorePhotos()">Показати більше фото</button>

    <div id="gallery-container"></div>


    <script>

        function changePhoto() {

            let imgElement = document.getElementById('main-photo');
            
            if (imgElement.src.includes('photo1.png')) {
                imgElement.src = 'photo2.png';
            } else {
                imgElement.src = 'photo1.png';
            }
        }

        function addMorePhotos() {

            let container = document.getElementById('gallery-container');
            
            container.innerHTML = `
                <img src="photo3.png" alt="Фото 3" />
                <img src="photo4.png" alt="Фото 4" />
                <img src="photo5.png" alt="Фото 5" />
            `;
        }
    </script>
    </body>
</html>
