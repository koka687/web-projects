<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Гнучка галерея зображень</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            padding: 10px;
        }

        .photo {
            background-color: #ccc;
            height: 100px;
        
            flex: 1 1 150px; 
            
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #333;
            
            transition: transform 0.3s ease, background-color 0.3s ease;
            border-radius: 5px;
        }

        .photo:hover {
            transform: scale(1.05); 
            background-color: #2196F3; 
            color: white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <div class="photo">Фото 1</div>
        <div class="photo">Фото 2</div>
        <div class="photo">Фото 3</div>
        <div class="photo">Фото 4</div>
        <div class="photo">Фото 5</div>
        <div class="photo">Фото 6</div>
    </div>

</body>
</html>
