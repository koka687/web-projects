<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1</title>
</head>
<body>
    <button onclick="toggleDescription()">Показати / Сховати опис</button>
    <div id="productDescription" style="display:none; padding:10px; background:lightyellow; margin-top:10px;">
        Це тестовий опис товару для першого завдання.
    </div>

    <script>
        function toggleDescription() {
            let description = document.getElementById("productDescription");
            if (description.style.display === "none" || description.style.display === "") {
                description.style.display = "block";
            } else {
                description.style.display = "none";
            }
        }
    </script>
</body>
</html>
