<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Vanilla JS Слайдер</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            padding: 20px; 
        }
        
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 30px; 
        }

        .slider {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 800px; 
            margin: 0 auto;
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
        }

        .slider-track {
            display: flex; 
            transition: transform 0.5s ease; 
        }

        .slide {
            min-width: 100%; 
            box-sizing: border-box;
        }

        .slide img {
            width: 100%;
            height: 450px; 
            object-fit: cover; 
            display: block;
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 35px;
            padding: 10px 20px;
            cursor: pointer;
            z-index: 10;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn:hover { background: rgba(0, 0, 0, 0.8); }
        .prev { left: 15px; }
        .next { right: 15px; }
    </style>
</head>
<body>

    <h2>Слайдер на чистому (Vanilla) JavaScript</h2>

    <div class="slider">
        <div class="slider-track">
            <div class="slide"><img src="image/image1.png" alt="Слайд 1"></div>
            <div class="slide"><img src="image/image2.png" alt="Слайд 2"></div>
            <div class="slide"><img src="image/image3.png" alt="Слайд 3"></div>
            <div class="slide"><img src="image/image4.png" alt="Слайд 4"></div>
        </div>
        
        <button class="btn prev">‹</button>
        <button class="btn next">›</button>
    </div>

    <script>
        const track = document.querySelector('.slider-track');
        const slides = Array.from(track.children);
        const nextButton = document.querySelector('.next');
        const prevButton = document.querySelector('.prev');
        let currentIndex = 0;

        function updateSlidePosition() {
            const slideWidth = slides[0].getBoundingClientRect().width;
            track.style.transform = `translateX(-${currentIndex * slideWidth}px)`;
        }

        nextButton.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % slides.length;
            updateSlidePosition();
        });

        prevButton.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            updateSlidePosition();
        });

        window.addEventListener('resize', updateSlidePosition);
    </script>

</body>
</html>
